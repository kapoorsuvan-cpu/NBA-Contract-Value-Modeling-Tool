name: Keep Streamlit app awake

on:
  schedule:
    # Streamlit Community Cloud hibernates apps after 12 hours without traffic.
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: keep-streamlit-awake
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    env:
      STREAMLIT_APP_URL: ${{ vars.STREAMLIT_APP_URL }}
    steps:
      - name: Check deployment URL
        if: ${{ env.STREAMLIT_APP_URL == '' }}
        run: |
          echo "Set the STREAMLIT_APP_URL repository variable after deployment."
          exit 1

      - name: Ping the app
        if: ${{ env.STREAMLIT_APP_URL != '' }}
        run: |
          curl --fail --silent --show-error \
            --location \
            --retry 3 \
            --retry-delay 10 \
            --max-time 60 \
            "$STREAMLIT_APP_URL" >/dev/null
